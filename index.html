<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>2D Car Racer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-wrapper">

        <h1>🏎️ 2D Car Racer</h1>


        <!-- =========================
             GAME SETTINGS
        ========================== -->

        <section class="game-menu">

            <div class="setting">

                <label for="carColor">
                    Car Color
                </label>

                <input
                    type="color"
                    id="carColor"
                    value="#ff0000"
                >

            </div>


            <div class="setting">

                <label for="speedSelect">
                    Game Speed
                </label>

                <select id="speedSelect">

                    <option value="4">
                        Slow
                    </option>

                    <option value="6" selected>
                        Normal
                    </option>

                    <option value="9">
                        Fast
                    </option>

                    <option value="12">
                        Extreme
                    </option>

                </select>

            </div>


            <button id="startButton">
                Start Game
            </button>

        </section>


        <!-- =========================
             SCORE
        ========================== -->

        <div class="score-board">

            <div>
                Score:
                <span id="score">0</span>
            </div>

            <div>
                Best:
                <span id="highScore">0</span>
            </div>

        </div>


        <!-- =========================
             GAME AREA
        ========================== -->

        <div class="canvas-container">

            <canvas
                id="gameCanvas"
                width="400"
                height="600"
            ></canvas>


            <!-- GAME OVER -->

            <div
                id="gameOverScreen"
                class="game-over-screen hidden"
            >

                <h2>GAME OVER</h2>

                <p>
                    Your Score:
                    <strong id="finalScore">
                        0
                    </strong>
                </p>

                <button id="restartButton">
                    Play Again
                </button>

            </div>

        </div>


        <!-- =========================
             MOBILE CONTROLS
        ========================== -->

        <div class="mobile-controls">

            <button
                id="leftButton"
                class="control-button"
                aria-label="Move left"
            >
                ◀
                <span>LEFT</span>
            </button>


            <button
                id="rightButton"
                class="control-button"
                aria-label="Move right"
            >
                <span>RIGHT</span>
                ▶
            </button>

        </div>


        <!-- =========================
             INSTRUCTIONS
        ========================== -->

        <div class="instructions">

            <p>
                <strong>Controls</strong>
            </p>

            <p class="desktop-instructions">
                💻 Use
                <strong>←</strong>
                <strong>→</strong>
                or
                <strong>A</strong>
                <strong>D</strong>
            </p>

            <p class="mobile-instructions">
                📱 Use the
                <strong>LEFT</strong>
                and
                <strong>RIGHT</strong>
                buttons
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
